{{define "head"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{if .}}{{.}} · {{end}}oytc</title>
<style>
:root { --accent: #4DABF7; --border: #e5e5e5; --muted: #666; }
* { box-sizing: border-box; }
body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #000; background: #fff; -webkit-text-size-adjust: 100%; }
.wrap { max-width: 880px; margin: 0 auto; padding: 0 20px; }
a { color: inherit; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
header { border-bottom: 1px solid var(--border); }
header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 56px; }
.brand { font-weight: 700; font-size: 17px; text-decoration: none; }
.account { display: flex; align-items: center; gap: 16px; min-width: 0; font-size: 14px; color: var(--muted); }
.account span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
main { padding-bottom: 48px; }
section { margin-top: 40px; }
h1 { font-size: 28px; line-height: 1.2; margin: 40px 0 24px; }
h2 { font-size: 18px; margin: 0; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 36px; margin-bottom: 12px; }
form { margin: 0; }
button, .button { display: inline-flex; align-items: center; justify-content: center; height: 34px; padding: 0 14px; font: inherit; font-size: 14px; color: #000; background: #fff; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; text-decoration: none; white-space: nowrap; }
button:hover, .button:hover { border-color: #000; }
.primary { background: var(--accent); border-color: var(--accent); }
.link { height: auto; padding: 0; border: 0; background: none; color: inherit; text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 3px; }
input { height: 34px; padding: 0 10px; font: inherit; font-size: 14px; border: 1px solid var(--border); border-radius: 6px; min-width: 0; }
input:focus { outline: none; border-color: var(--accent); }
.scroll { overflow-x: auto; }
table { width: 100%; min-width: 620px; border-collapse: collapse; table-layout: fixed; font-size: 14px; }
th, td { text-align: left; height: 48px; padding: 0 12px 0 0; border-bottom: 1px solid var(--border); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
th { height: 36px; font-weight: 600; color: var(--muted); }
.actions { text-align: right; padding-right: 0; }
.actions form { display: inline-block; }
.muted { color: var(--muted); }
.empty { margin: 0; padding: 13px 0; border-top: 1px solid var(--border); color: var(--muted); font-size: 14px; }
.error { margin: 24px 0 0; padding: 12px 14px; border: 1px solid #000; border-radius: 6px; }
.new-key { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; padding: 10px 10px 10px 14px; border: 1px solid var(--accent); border-radius: 6px; background: #eef7fe; }
.new-key code { flex: 1; min-width: 0; font-size: 13px; overflow-wrap: anywhere; }
.copy { flex: none; width: 76px; }
.create { display: flex; gap: 8px; margin-bottom: 12px; }
.create input { flex: 1; max-width: 300px; }
code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
pre { margin: 0 0 20px; padding: 12px 14px; font-size: 13px; line-height: 1.5; background: #fafafa; border: 1px solid var(--border); border-radius: 6px; overflow-x: auto; }
.label { margin: 0 0 6px; font-size: 14px; font-weight: 600; }
.label span { margin-left: 6px; font-weight: 400; color: var(--muted); }
.landing { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; min-height: 70vh; }
.landing h1 { margin-top: 0; }
.prose { max-width: 680px; }
.prose p { margin: 0 0 14px; }
footer { padding: 24px 0 32px; font-size: 13px; color: var(--muted); }
@media (max-width: 600px) { .create input { max-width: none; } h1 { font-size: 24px; } }
</style>
</head>
<body>
{{end}}

{{define "foot"}}<footer><div class="wrap"><a href="/privacy">Privacy</a></div></footer>
</body>
</html>
{{end}}
